<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <link rel="stylesheet" href="../styles/contacto.css">
    <link rel="stylesheet" href="../styles/global.css">
</head>

<body>

    <header class="header">
        <div class="logo">Turismo Jujuy</div>

        <nav class="navbar">
            <ul class="menu">
                <li><a href="index.html">Inicio</a></li>

                <li class="dropdown">
                    <a href="#">Destinos</a>

                    <div class="mega-menu">
                        <a href="destinos.html#cultural">Cultural</a>
                        <a href="destinos.html#naturaleza">Naturaleza</a>
                        <a href="destinos.html#playa">Sol y Playa</a>
                        <a href="destinos.html#gastronomia">Gastronomía</a>
                    </div>
                </li>

                <li><a href="agencias.html">Agencias</a></li>
                <li><a href="precios.html">Precios</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="blog.html">Blog de Destinos</a></li>
            </ul>
        </nav>

        <button id="dark-toggle">🌙</button>
    </header>

    <main class="contact-page">

        <section class="contact-container">
            <h1>Contactanos</h1>

            <form id="contactForm" class="contact-form">

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" required minlength="3">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group full">
                    <label>Mensaje</label>
                    <textarea required minlength="10"></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Enviar Consulta
                </button>

                <div class="spinner" id="spinner"></div>

            </form>
        </section>

    </main>

    <footer class="footer">

        <div class="newsletter">
            <h3>Suscribite al Newsletter</h3>
            <form>
                <input type="email" placeholder="Tu email" required>
                <button type="submit">Suscribirme</button>
            </form>
        </div>

        <div class="social">
            <h3>Seguinos</h3>
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
        </div>

        <div class="map">
            <h3>Ubicación</h3>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18..." loading="lazy">
            </iframe>
        </div>

    </footer>

    <!-- MODAL -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <h2>¡Consulta enviada!</h2>
            <p>Nos pondremos en contacto pronto.</p>
            <button id="closeModal">Cerrar</button>
        </div>
    </div>

    <script src="../resources/scripts/contacto.js"></script>
    <script src="../resources/scripts/darkmode.js"></script>

</body>

</html>
